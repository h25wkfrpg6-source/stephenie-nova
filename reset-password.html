
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Stephenie Nova</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#fff5fa;color:#352331;font-family:Arial,sans-serif}
.card{width:min(100%,420px);background:white;border:1px solid #f0d4e2;border-radius:18px;padding:26px}
h1{text-align:center;color:#8d315f;font-size:24px}
p{text-align:center;color:#806879;font-size:14px}
label{display:block;font-weight:bold;font-size:13px;margin:18px 0 7px}
input{width:100%;padding:14px;border:1px solid #e8c6d7;border-radius:9px;font-size:16px}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:9px;background:#bd5489;color:white;font-weight:bold}
#message{text-align:center;font-size:14px;margin-top:15px}
</style>
</head>
<body>
<section class="card">
<h1>STEPHENIE NOVA</h1>
<p>Choose a new password for your admin account.</p>
<form id="resetForm" hidden>
<label>New password</label>
<input id="newPassword" type="password" minlength="8" required>
<label>Confirm new password</label>
<input id="confirmPassword" type="password" minlength="8" required>
<button id="saveBtn">Update password</button>
</form>
<div id="message">Checking recovery link...</div>
</section>
<script>
const db = window.supabase.createClient(
"https://cnkggilywausfgoacgva.supabase.co",
"sb_publishable_znAq3vcHAmCeFh7JlujzvQ_YJjMByRU"
);
const form=document.getElementById("resetForm");
const message=document.getElementById("message");
const button=document.getElementById("saveBtn");

db.auth.onAuthStateChange((event,session)=>{
if(event==="PASSWORD_RECOVERY" || session){
form.hidden=false;
message.textContent="Enter your new password below.";
}
});

form.addEventListener("submit",async e=>{
e.preventDefault();
const password=document.getElementById("newPassword").value;
const confirm=document.getElementById("confirmPassword").value;
if(password.length<8){message.textContent="Use at least 8 characters.";return;}
if(password!==confirm){message.textContent="Passwords do not match.";return;}
button.disabled=true;
message.textContent="Updating password...";
const {error}=await db.auth.updateUser({password});
button.disabled=false;
if(error){message.textContent=error.message;return;}
form.hidden=true;
message.textContent="Password updated successfully! Return to your admin dashboard and log in.";
});
</script>
</body>
</html>
