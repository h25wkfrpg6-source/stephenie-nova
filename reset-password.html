
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password | Stephenie Nova</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: #fff3f8;
  font-family: Arial, sans-serif;
  color: #352331;
}

.card {
  width: 100%;
  max-width: 430px;
  background: white;
  border: 1px solid #f1c9dc;
  border-radius: 22px;
  padding: 30px 24px;
  box-shadow: 0 8px 30px #e8bfd055;
}

h1 {
  text-align: center;
  color: #96365f;
  font-size: 27px;
  letter-spacing: 1px;
}

.subtitle {
  text-align: center;
  color: #806879;
  line-height: 1.6;
  margin-bottom: 25px;
}

label {
  display: block;
  margin: 17px 0 8px;
  font-size: 14px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 15px;
  border: 1px solid #e9bfd2;
  border-radius: 10px;
  font-size: 16px;
  outline-color: #bd5489;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 24px;
  border: none;
  border-radius: 10px;
  background: #b9477d;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

#message {
  text-align: center;
  font-size: 14px;
  line-height: 1.6;
  margin-top: 20px;
  overflow-wrap: anywhere;
}

.success {
  color: #247a48;
}

.error {
  color: #bd3150;
}

#resetForm[hidden] {
  display: none;
}
</style>
</head>

<body>

<div class="card">

<h1>STEPHENIE NOVA</h1>

<p class="subtitle">
Create a new password for your admin account.
</p>

<form id="resetForm" hidden>

<label for="password">New password</label>
<input
  type="password"
  id="password"
  minlength="8"
  autocomplete="new-password"
  placeholder="Enter new password"
  required
>

<label for="confirmPassword">Confirm password</label>
<input
  type="password"
  id="confirmPassword"
  minlength="8"
  autocomplete="new-password"
  placeholder="Confirm new password"
  required
>

<button id="saveButton" type="submit">
UPDATE PASSWORD
</button>

</form>

<p id="message">Connecting securely to Supabase...</p>

</div>

<script>
const SUPABASE_URL =
"https://cnkggilywausfgoacgva.supabase.co";

const SUPABASE_KEY =
"sb_publishable_znAq3vcHAmCeFh7JlujzvQ_YJjMByRU";

const form = document.getElementById("resetForm");
const message = document.getElementById("message");
const button = document.getElementById("saveButton");

let recoveryReady = false;

function showMessage(text, type = "") {
  message.textContent = text;
  message.className = type;
}

function showRecoveryForm() {
  recoveryReady = true;
  form.hidden = false;
  showMessage("Your recovery link is verified. Choose your new password.");
}

function showRecoveryError(text) {
  form.hidden = true;
  showMessage(text, "error");
}

const params = new URLSearchParams(window.location.search);
const hashParams = new URLSearchParams(
  window.location.hash.substring(1)
);

const urlError =
  params.get("error_description") ||
  hashParams.get("error_description") ||
  params.get("error");

if (urlError) {
  showRecoveryError(
    "Recovery link error: " + urlError
  );
} else if (!window.supabase) {
  showRecoveryError(
    "Supabase could not load. Check your internet connection and reload."
  );
} else {

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        autoRefreshToken: true,
        persistSession: true,
        detectSessionInUrl: true
      }
    }
  );

  const { data: { subscription } } =
    supabase.auth.onAuthStateChange((event, session) => {

      if (event === "PASSWORD_RECOVERY" && session) {
        showRecoveryForm();
      }

    });

  setTimeout(() => {
    if (!recoveryReady) {
      showRecoveryError(
        "No valid recovery session was detected. Your link may have expired or failed verification. Request a fresh recovery email after the email limit resets."
      );
    }
  }, 12000);

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!recoveryReady) {
      showMessage("Please verify your recovery link first.", "error");
      return;
    }

    const password =
      document.getElementById("password").value;

    const confirmation =
      document.getElementById("confirmPassword").value;

    if (password.length < 8) {
      showMessage("Your password must contain at least 8 characters.", "error");
      return;
    }

    if (password !== confirmation) {
      showMessage("Your passwords do not match.", "error");
      return;
    }

    button.disabled = true;
    button.textContent = "UPDATING...";

    const { error } = await supabase.auth.updateUser({
      password: password
    });

    button.disabled = false;
    button.textContent = "UPDATE PASSWORD";

    if (error) {
      showMessage(error.message, "error");
      return;
    }

    form.hidden = true;

    showMessage(
      "SUCCESS! Your password has been updated. You can now log in to your Stephenie Nova admin dashboard.",
      "success"
    );
  });
}
</script>

</body>
</html>
