
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stephenie Nova Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#fff1f6;color:#54263b;font-family:Arial,sans-serif}
main{max-width:600px;margin:auto}
header{text-align:center;background:#f7c3da;padding:22px;border-radius:18px}
.panel{background:white;padding:18px;border-radius:16px;margin:16px 0;box-shadow:0 3px 12px #e8bfd0}
input,button{width:100%;padding:13px;margin:7px 0;border:1px solid #e5b8cc;border-radius:10px;font-size:16px}
button{background:#d63384;color:white;border:0;font-weight:bold}
button.secondary{background:#80506a}
button.delete{background:#b52d52}
.product{display:flex;gap:12px;align-items:center;border-top:1px solid #f0d7e2;padding:14px 0}
.product img{width:75px;height:75px;object-fit:cover;border-radius:9px}
.product-info{flex:1;min-width:0}
.product-info p{margin:6px 0}
.hidden{display:none}
#status,#loginStatus{white-space:pre-wrap;font-size:14px}
</style>
</head>
<body>
<main>
<header>
<h1>STEPHENIE NOVA</h1>
<p>ADMIN DASHBOARD ✨</p>
</header>

<section class="panel" id="loginPanel">
<h3>Admin Login</h3>
<input id="password" type="password" placeholder="Enter your private password">
<button id="loginButton" onclick="login()">LOG IN</button>
<p id="loginStatus"></p>
</section>

<section id="dashboard" class="hidden">
<div class="panel">
<h3>Add a Product</h3>
<input id="name" placeholder="Product name">
<input id="price" type="number" placeholder="Selling price (₦)">
<input id="oldPrice" type="number" placeholder="Old price (optional)">
<input id="photo" type="file" accept="image/*">
<button id="saveButton" onclick="saveProduct()">ADD PRODUCT</button>
<p id="status"></p>
</div>

<div class="panel">
<h3>Your Products</h3>
<button class="secondary" onclick="loadProducts()">REFRESH PRODUCTS</button>
<div id="products">Loading products...</div>
</div>

<button class="secondary" onclick="logout()">LOG OUT</button>
</section>
</main>

<script>
const SUPABASE_URL = "https://cnkggilywausfgoacgva.supabase.co";
const SUPABASE_KEY = "sb_publishable_znAq3vcHAmCeFh7JIujzvQ_YJjMByRU";
const FUNCTION_URL = SUPABASE_URL + "/functions/v1/admin-login";

let sessionToken = sessionStorage.getItem("sn_admin_token") || "";
let editingId = null;

async function request(payload, authenticated = true) {
  const headers = {
    "Content-Type": "application/json",
    "apikey": SUPABASE_KEY
  };

  if (authenticated && sessionToken) {
    headers["Authorization"] = "Bearer " + sessionToken;
  }

  const response = await fetch(FUNCTION_URL, {
    method: "POST",
    headers,
    body: JSON.stringify(payload)
  });

  const result = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(result.error || "Request failed. Please try again.");
  }

  return result;
}

async function login() {
  const password = document.getElementById("password").value;
  const output = document.getElementById("loginStatus");
  const button = document.getElementById("loginButton");

  if (!password) {
    output.textContent = "Enter your password.";
    return;
  }

  button.disabled = true;
  output.textContent = "Logging in...";

  try {
    const result = await request({
      action: "login",
      password: password
    }, false);

    if (!result.token) {
      throw new Error("Login response did not contain a session token.");
    }

    sessionToken = result.token;
    sessionStorage.setItem("sn_admin_token", sessionToken);

    document.getElementById("password").value = "";
    document.getElementById("loginPanel").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    await loadProducts();
  } catch (error) {
    output.textContent = error.message;
  } finally {
    button.disabled = false;
  }
}

async function loadProducts() {
  const area = document.getElementById("products");
  area.textContent = "Loading products...";

  try {
    const result = await request({action: "list"});
    const products = result.products || [];

    area.innerHTML = "";

    if (!products.length) {
      area.textContent = "No products found yet.";
      return;
    }

    products.forEach(product => {
      const item = document.createElement("div");
      item.className = "product";

      const img = document.createElement("img");
      img.src = product.image_url || "";
      img.alt = product.name || "Product";

      const details = document.createElement("div");
      details.className = "product-info";

      const title = document.createElement("b");
      title.textContent = product.name || "Unnamed product";

      const price = document.createElement("p");
      price.textContent = "₦" + Number(product.price).toLocaleString();

      const edit = document.createElement("button");
      edit.textContent = "EDIT";
      edit.className = "secondary";
      edit.onclick = () => editProduct(product);

      const remove = document.createElement("button");
      remove.textContent = "DELETE";
      remove.className = "delete";
      remove.onclick = () => deleteProduct(product.id);

      details.append(title, price, edit, remove);
      item.append(img, details);
      area.append(item);
    });
  } catch (error) {
    area.textContent = error.message;
  }
}

function editProduct(product) {
  editingId = product.id;

  document.getElementById("name").value = product.name || "";
  document.getElementById("price").value = product.price || "";
  document.getElementById("oldPrice").value = product.old_price || "";
  document.getElementById("photo").value = "";

  document.getElementById("saveButton").textContent = "SAVE CHANGES";
  document.getElementById("status").textContent =
    "Editing " + product.name + ". Photos will stay unchanged.";

  window.scrollTo({top: 0, behavior: "smooth"});
}

function resetForm() {
  editingId = null;
  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("oldPrice").value = "";
  document.getElementById("photo").value = "";
  document.getElementById("saveButton").textContent = "ADD PRODUCT";
}

async function saveProduct() {
  const name = document.getElementById("name").value.trim();
  const price = Number(document.getElementById("price").value);
  const oldPrice = document.getElementById("oldPrice").value;
  const file = document.getElementById("photo").files[0];
  const status = document.getElementById("status");
  const button = document.getElementById("saveButton");

  if (!name || !price || price <= 0) {
    status.textContent = "Enter a product name and valid price.";
    return;
  }

  if (!editingId && !file) {
    status.textContent = "Please select a product photo.";
    return;
  }

  if (file && file.size > 4 * 1024 * 1024) {
    status.textContent = "Please choose a photo smaller than 4MB.";
    return;
  }

  button.disabled = true;
  status.textContent = "Saving product...";

  try {
    let result;

    if (editingId) {
      result = await request({
        action: "update",
        id: editingId,
        name: name,
        price: price,
        oldPrice: oldPrice ? Number(oldPrice) : null
      });
    } else {
      const base64 = await fileToBase64(file);
      const extension = file.name.split(".").pop().toLowerCase();

      result = await request({
        action: "add",
        name: name,
        price: price,
        oldPrice: oldPrice ? Number(oldPrice) : null,
        imageBase64: base64,
        extension: extension,
        contentType: file.type || "image/jpeg"
      });
    }

    status.textContent = editingId ? "Product updated!" : "Product added!";
    resetForm();
    await loadProducts();
  } catch (error) {
    status.textContent = error.message;
  } finally {
    button.disabled = false;
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      const data = reader.result.split(",")[1];
      resolve(data);
    };

    reader.onerror = () => reject(new Error("Could not read photo."));
    reader.readAsDataURL(file);
  });
}

async function deleteProduct(id) {
  if (!confirm("Are you sure you want to delete this product?")) return;

  const area = document.getElementById("products");

  try {
    await request({
      action: "delete",
      id: id
    });

    area.textContent = "Product deleted.";
    await loadProducts();
  } catch (error) {
    area.textContent = error.message;
  }
}

function logout() {
  sessionStorage.removeItem("sn_admin_token");
  sessionToken = "";
  location.reload();
}

if (sessionToken) {
  document.getElementById("loginPanel").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  loadProducts().catch(() => logout());
}
</script>
</body>
</html>
